[project]
name = "happygarden"
version = "0.1.0"
description = "Віртуальна теплиця, город і фазенда. Один Python-код для сайту і iPhone."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "flet>=1.0,<2",
  "httpx>=0.27",
  "certifi>=2024.0.0",
]

[tool.flet]
org = "com.happygarden"
product = "HappyGarden"
company = "HappyGarden"
# CocoaPods + serious_python: avoid SPM/Pods conflict on iOS
swift_package_manager = false

[tool.flet.app]
module = "main.py"

[tool.flet.ios]
bundle_id = "com.happygarden.app"

[tool.flet.web]
# Netlify віддає лише index.html. Hash не вимагає окремої сторінки на кожен маршрут.
route_url_strategy = "hash"
